<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Match recap · League Stats</title><link rel="stylesheet" href="postgame.css"><link rel="stylesheet" href="postgame-layout.css"><link rel="stylesheet" href="postgame-stories.css"><link rel="stylesheet" href="postgame-analysis.css"></head>
<body><section id="showControls" hidden aria-label="Stream controls"><div class="control-title"><span id="showStatus" role="status">Preview</span><small>Changes sync to your lobby overlay</small></div><div class="control-actions"><button id="showToggle">Show on OBS</button><button id="autoToggle">Auto after games</button><button id="popOut">Open larger ↗</button></div><p id="controlError" role="alert"></p></section><main id="chronicle" hidden>
<div id="backdrop" aria-hidden="true"></div><header><div id="portrait"></div><div class="identity"><h1 id="identity"></h1><div class="subline"><span id="role"></span><span id="duration"></span><span id="outcome" aria-label="Match outcome"></span></div></div><div class="kda"><strong id="kda"></strong><small>K / D / A</small></div></header>
<section id="scoreline" aria-label="Match statistics"></section>
<nav aria-label="Recap views"><div id="tabs"></div><span id="pageLabel"></span><button id="previous" title="Previous detail" aria-label="Previous detail">‹</button><button id="next" title="Next detail" aria-label="Next detail">›</button><button id="pause" title="Pause automatic pages" aria-label="Pause automatic pages">Ⅱ</button></nav>
<section id="view" aria-live="off"></section>
<footer><div id="items" aria-label="Final inventory"></div><a id="lifetime" href="/#projects/league_stats" title="Open recorded lifetime stats"></a></footer>
<div class="status"><span id="coverage"></span><span id="rotation"></span><span id="connection"></span><button id="allEvents">All stats ↗</button></div>
</main><div id="empty"><h1>Match recap</h1><p>Waiting for a completed game</p><a href="/#projects/league_stats">Recorded lifetime stats ↗</a></div><section id="fullTimeline" hidden><h2>All reported statistics</h2><div id="fullStats"></div><h2>Complete personal & objective timeline</h2><div id="fullEvents"></div></section><script type="module" src="postgame.js"></script></body></html>
