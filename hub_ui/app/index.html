<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OBS Hub</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<!-- ── Sidebar navigation ─────────────────────────────────────────── -->
<nav id="nav" class="nav">
  <div class="nav-header">
    <span class="nav-logo">OBS Hub</span>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">&#9776;</button>
  </div>

  <div class="nav-section-label">Hub</div>
  <a class="nav-item" href="#dashboard" data-page="dashboard">
    <svg class="nav-icon" viewBox="0 0 20 20"><rect x="2" y="2" width="7" height="7" rx="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5"/></svg>
    Dashboard
  </a>
  <a class="nav-item" href="#rules" data-page="rules">
    <svg class="nav-icon" viewBox="0 0 20 20"><path d="M10 2L3 7v6l7 5 7-5V7z" stroke-width="1.5" fill="none" stroke="currentColor"/><path d="M10 2v15" stroke-width="1.5" stroke="currentColor"/></svg>
    Hub Rules
  </a>
  <a class="nav-item" href="#profiles" data-page="profiles">
    <svg class="nav-icon" viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="4" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none"/><rect x="3" y="12" width="14" height="4" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
    Profiles
  </a>
  <a class="nav-item" href="#settings" data-page="settings">
    <svg class="nav-icon" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M10 1v2M10 17v2M1 10h2M17 10h2M3.22 3.22l1.42 1.42M15.36 15.36l1.42 1.42M15.36 4.64l-1.42 1.42M4.64 15.36l-1.42 1.42" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    Settings
  </a>

  <div class="nav-section-label">Projects</div>
  <div id="navProjects" class="nav-projects"></div>

  <div class="nav-section-label">Tools</div>
  <a class="nav-item" href="#audio" data-page="audio">
    <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
      <line x1="3" y1="10" x2="17" y2="10"/>
      <rect x="5" y="7" width="3" height="6" rx="1" fill="currentColor" stroke="none"/>
      <rect x="10" y="5" width="3" height="10" rx="1" fill="currentColor" stroke="none"/>
      <rect x="15" y="8" width="3" height="4" rx="1" fill="currentColor" stroke="none"/>
    </svg>
    Audio
  </a>
  <a class="nav-item" href="#mixer" data-page="mixer">
    <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
      <line x1="4" y1="2" x2="4" y2="18"/><line x1="10" y1="2" x2="10" y2="18"/><line x1="16" y1="2" x2="16" y2="18"/>
      <rect x="2" y="11" width="4" height="3" rx="1.5" fill="currentColor" stroke="none"/>
      <rect x="8" y="5" width="4" height="3" rx="1.5" fill="currentColor" stroke="none"/>
      <rect x="14" y="8" width="4" height="3" rx="1.5" fill="currentColor" stroke="none"/>
    </svg>
    OBS Mixer
  </a>
  <a class="nav-item nav-external" href="http://localhost:8000" target="_blank" rel="noopener">
    <svg class="nav-icon" viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M7 10h6M10 7l3 3-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Hotkey Editor
  </a>
</nav>

<!-- ── Main content ───────────────────────────────────────────────── -->
<main id="main" class="main">
  <div id="page" class="page"></div>
</main>

<!-- ── Toast container ───────────────────────────────────────────── -->
<div id="toasts" class="toasts" aria-live="polite"></div>

<!-- ── Status bar ────────────────────────────────────────────────── -->
<div id="statusBar" class="status-bar">
  <span id="statusDot" class="status-dot status-dot--ok"></span>
  <span id="statusText" class="status-text">Connecting…</span>
  <span id="statusTime" class="status-time"></span>
</div>

<!-- ── JS modules ────────────────────────────────────────────────── -->
<script type="module" src="js/app.js"></script>

</body>
</html>
