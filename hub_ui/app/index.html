<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12161b">
  <title>Stream Hub</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/replay-studio.css">
  <link rel="stylesheet" href="/css/workspace.css">
  <link rel="stylesheet" href="/css/live-desk.css">
  <link rel="stylesheet" href="/css/workflows.css">
</head>
<body>
  <a class="skip-link" href="#page">Skip to controls</a>
  <nav id="nav" class="nav" aria-label="Main navigation">
    <a class="nav-brand" href="#dashboard"><span class="brand-mark" aria-hidden="true">h<span></span></span><span>Stream Hub<small>Your stream, at hand.</small></span></a>
    <div class="nav-section-label">Workspace</div>
    <a class="nav-item" href="#dashboard" data-page="dashboard" data-icon="desk">Live desk</a>
    <a class="nav-item" href="#library" data-page="library" data-icon="library">Library &amp; tools</a>
    <a class="nav-item" href="#workflows" data-page="workflows" data-icon="automation">Stream map</a>
    <a class="nav-item" href="#mixer" data-page="mixer" data-icon="audio">Audio</a>
    <div class="nav-section-label">Quick access</div>
    <div id="navProjects" class="nav-projects"></div>
    <details class="nav-setup" id="navSetup">
      <summary>Setup &amp; preferences</summary>
      <a class="nav-item" href="#rules" data-page="rules" data-icon="automation">Automation rules</a>
      <a class="nav-item" href="#profiles" data-page="profiles" data-icon="keyboard">Hotkeys &amp; profiles</a>
      <a class="nav-item" href="#voice" data-page="voice" data-icon="voice">Voice &amp; microphone</a>
      <a class="nav-item" href="#settings" data-page="settings" data-icon="settings">Hub settings</a>
    </details>
    <div class="nav-footer"><span class="nav-local-dot"></span> Personal workspace <small>Running on your computer</small></div>
  </nav>
  <main id="main" class="main">
    <header class="workspace-bar">
      <button class="nav-toggle" id="navToggle" aria-label="Open navigation" aria-controls="nav" aria-expanded="false">☰</button>
      <div id="breadcrumbs" class="breadcrumbs"></div>
      <button class="workspace-search" id="workspaceSearch" aria-label="Find a control or page"><span data-icon="search"></span><span>Find a control…</span><kbd>Ctrl K</kbd></button>
      <div id="statusBar" class="connection-status" role="status"><span id="statusDot" class="status-dot status-dot--offline"></span><span id="statusText">Connecting…</span><span id="statusTime" class="sr-only"></span></div>
    </header>
    <div id="page" class="page" tabindex="-1"></div>
  </main>
  <button class="nav-scrim" id="navScrim" aria-label="Close navigation" hidden></button>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
