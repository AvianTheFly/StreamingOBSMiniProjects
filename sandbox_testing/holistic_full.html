<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; cursor: crosshair; }
    #toolbar {
      position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
      background: rgba(20,20,20,0.92); color: #fff;
      font-family: monospace; font-size: 13px;
      padding: 7px 18px; z-index: 9999;
      display: flex; gap: 12px; align-items: center;
      border-radius: 8px; border: 1px solid #444;
      flex-wrap: wrap; justify-content: center; max-width: 95vw;
    }
    #toolbar button {
      background: #2a2a2a; color: #ddd; border: 1px solid #555;
      padding: 4px 12px; cursor: pointer; border-radius: 4px;
      font-family: monospace; font-size: 12px;
    }
    #toolbar button:hover { background: #444; }
    #toolbar button.active { background: #0a6; border-color: #0c8; color: #fff; }
    #toolbar select {
      background: #333; color: #fff; border: 1px solid #555;
      border-radius: 3px; padding: 3px 6px; font-family: monospace; font-size: 12px;
    }
    .label { color: #999; font-size: 11px; }
    .sep { width: 1px; height: 22px; background: #444; }

    /* sprite editor modal */
    #spriteModal {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85); z-index: 10000;
      justify-content: center; align-items: center;
    }
    #spriteModal.open { display: flex; }
    #spriteModal .panel {
      background: #1a1a1a; border: 1px solid #444; border-radius: 8px;
      padding: 16px; display: flex; flex-direction: column; gap: 10px;
      max-width: 90vw;
    }
    #spriteModal h3 { margin: 0; color: #fff; }
    #spriteModal .hint { color: #888; font-size: 11px; }
    #spriteModal canvas { border: 1px solid #555; cursor: crosshair; }
    #spriteModal .point-list {
      max-height: 180px; overflow-y: auto;
      border: 1px solid #333; border-radius: 4px;
    }
    #spriteModal .point-item {
      padding: 4px 8px; display: flex; justify-content: space-between;
      align-items: center; font-family: monospace; font-size: 12px; color: #ccc;
    }
    #spriteModal .point-item:hover { background: #333; }
    #spriteModal .point-item.selected { background: #0a6; color: #fff; }
    #spriteModal .point-item .del { color: #f66; cursor: pointer; margin-left: 6px; }
  </style>
</head>
<body>
<video id="video" autoplay playsinline style="display:none;"></video>
<canvas id="canvas"></canvas>
<div id="toolbar">
  <button id="btnEditor" class="active" onclick="setMode('editor')">EDITOR</button>
  <button id="btnPlay" onclick="setMode('play')">PLAY</button>
  <button onclick="clearAllWp()">CLEAR ALL</button>
  <span class="sep"></span>
  <button onclick="openSpriteEditor()">SPRITE POINTS</button>
  <span id="anchorLabel" style="color:#0f0; font-weight:bold;"></span>
  <div class="sep"></div>
  <span class="sel">Draw on: <select id="selAnim"><option value="1">Anim 1 (red)</option><option value="2">Anim 2 (blue)</option></select></span>
  <span class="sep"></span>
  <span class="label">Face target: <select id="selFace"><option value="mouth">Mouth</option><option value="leftEye">Left Eye</option><option value="rightEye">Right Eye</option><option value="nose">Nose</option></select></span>
</div>

<!-- SPRITE POINT EDITOR MODAL -->
<div id="spriteModal">
  <div class="panel">
    <h3>Annotate Sprite Points</h3>
    <div class="hint">Click the sprite to place a point. Click a point name to select it. Click ✕ to delete. Set an anchor point — that's what touches your waypoints.</div>
    <canvas id="spriteEditCanvas"></canvas>
    <div style="display:flex;gap:8px;align-items:center;">
      <input id="newPointName" placeholder="Point name (e.g. Straw tip)" style="background:#333;color:#fff;border:1px solid #555;border-radius:3px;padding:3px 6px;font-family:monospace;font-size:12px;flex:1;">
      <button id="addPointBtn" style="background:#0a6;color:#fff;border:none;border-radius:3px;padding:3px 12px;font-family:monospace;font-size:12px;cursor:pointer;">ADD POINT</button>
      <span>Anchor: <select id="anchorSelect" onchange="setAnchor(this.value)" style="background:#333;color:#fff;border:1px solid #555;border-radius:3px;padding:3px 6px;font-family:monospace;font-size:12px;"></select></span>
    </div>
    <div class="point-list" id="pointList"></div>
    <button onclick="closeSpriteEditor()" style="background:#444;color:#fff;border:none;border-radius:3px;padding:5px 16px;cursor:pointer;font-family:monospace;font-size:12px;">CLOSE</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic@0.5.1675471629/holistic.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"></script>
<script>
const videoEl = document.getElementById('video');
const canvas  = document.getElementById('canvas');
const ctx     = canvas.getContext('2d');
const W = 640, H = 480;
canvas.width = W; canvas.height = H;

/* ====== SPRITE ====== */
const sprite = new Image();
let spriteReady = false;
sprite.onload = () => { spriteReady = true; buildSpriteEditor(); };
sprite.onerror = () => console.log('sprite load failed');
sprite.src = 'bluedrink.png';
const SW = 140, SH = 190;

/* ====== SPRITE POINTS ====== */
// Each point: { name, sx, sy } where sx,sy are source-image pixel coords
let spritePoints = [];  // user-defined named points on the sprite
let anchorName = '';    // which point is the "attachment" anchor
let spriteEdCanvas, spriteEdCtx;

/* ---- Sprite Editor Modal ---- */
function openSpriteEditor() {
  document.getElementById('spriteModal').classList.add('open');
  updatePointList();
  updateAnchorSelect();
  drawSpriteEd();
}
function closeSpriteEditor() {
  document.getElementById('spriteModal').classList.remove('open');
}

function buildSpriteEditor() {
  spriteEdCanvas = document.getElementById('spriteEditCanvas');
  spriteEdCtx = spriteEdCanvas.getContext('2d');
  const w = sprite.naturalWidth || 200;
  const h = sprite.naturalHeight || 260;
  const maxW = 300, maxH = 400;
  const s = Math.min(maxW / w, maxH / h, 1);
  spriteEdCanvas.width = Math.round(w * s);
  spriteEdCanvas.height = Math.round(h * s);
  spriteEdCanvas._scale = s;

  // Add default center point
  spritePoints = [{ name: 'center', sx: sprite.naturalWidth / 2, sy: sprite.naturalHeight / 2 }];
  anchorName = 'center';
  document.getElementById('anchorLabel').textContent = 'Anchor: "center"';

  // click on sprite canvas to add points
  spriteEdCanvas.addEventListener('mousedown', e => {
    const rect = spriteEdCanvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (spriteEdCanvas.width / rect.width);
    const my = (e.clientY - rect.top) * (spriteEdCanvas.height / rect.height);
    // check if clicking existing point
    let hitIdx = -1;
    const s = spriteEdCanvas._scale;
    spritePoints.forEach((p, i) => {
      if (Math.hypot(p.sx * s - mx, p.sy * s - my) < 12) hitIdx = i;
    });
    if (hitIdx >= 0) {
      // start drag
      spriteDrag = hitIdx;
    } else {
      // add new point
      const name = 'Point ' + (spritePoints.length + 1);
      spritePoints.push({ name, sx: mx / spriteEdCanvas._scale, sy: my / spriteEdCanvas._scale });
      drawSpriteEd(); updatePointList(); updateAnchorSelect();
    }
  });
  spriteEdCanvas.addEventListener('mousemove', e => {
    if (spriteDrag === null) return;
    const rect = spriteEdCanvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (spriteEdCanvas.width / rect.width);
    const my = (e.clientY - rect.top) * (spriteEdCanvas.height / rect.height);
    spritePoints[spriteDrag].sx = mx / spriteEdCanvas._scale;
    spritePoints[spriteDrag].sy = my / spriteEdCanvas._scale;
    drawSpriteEd();
  });
  spriteEdCanvas.addEventListener('mouseup', () => { spriteDrag = null; });

  drawSpriteEd();
}

let spriteDrag = null;

function drawSpriteEd() {
  if (!spriteEdCtx) return;
  spriteEdCtx.clearRect(0, 0, spriteEdCanvas.width, spriteEdCanvas.height);
  spriteEdCtx.drawImage(sprite, 0, 0, spriteEdCanvas.width, spriteEdCanvas.height);

  const s = spriteEdCanvas._scale;
  spritePoints.forEach(p => {
    const px = p.sx * s, py = p.sy * s;
    const isAnch = p.name === anchorName;

    // dot
    spriteEdCtx.beginPath();
    spriteEdCtx.arc(px, py, 8, 0, Math.PI * 2);
    spriteEdCtx.strokeStyle = isAnch ? '#0f0' : '#ff0';
    spriteEdCtx.lineWidth = 3;
    spriteEdCtx.stroke();
    spriteEdCtx.beginPath();
    spriteEdCtx.arc(px, py, 3, 0, Math.PI * 2);
    spriteEdCtx.fillStyle = isAnch ? '#0f0' : '#ff0';
    spriteEdCtx.fill();

    // label
    spriteEdCtx.fillStyle = '#fff';
    spriteEdCtx.font = 'bold 12px monospace';
    spriteEdCtx.fillText(p.name, px + 12, py - 6);
  });
}

function addSpritePoint() {
  const name = document.getElementById('newPointName').value.trim() || ('Point ' + (spritePoints.length + 1));
  spritePoints.push({ name, sx: sprite.naturalWidth / 2, sy: sprite.naturalHeight / 2 });
  document.getElementById('newPointName').value = '';
  drawSpriteEd(); updatePointList(); updateAnchorSelect();
}
document.getElementById('addPointBtn').addEventListener('click', addSpritePoint);

function setAnchor(name) {
  anchorName = name;
  document.getElementById('anchorLabel').textContent = name ? 'Anchor: "' + name + '"' : '';
  drawSpriteEd(); updatePointList(); updateAnchorSelect();
}

function updateAnchorSelect() {
  const sel = document.getElementById('anchorSelect');
  sel.innerHTML = '';
  spritePoints.forEach(p => {
    const o = document.createElement('option');
    o.value = p.name; o.textContent = p.name;
    if (p.name === anchorName) o.selected = true;
    sel.appendChild(o);
  });
}

function updatePointList() {
  const list = document.getElementById('pointList');
  list.innerHTML = '';
  spritePoints.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'point-item' + (p.name === anchorName ? ' selected' : '');
    div.innerHTML = `<span>${p.name} (${p.name === anchorName ? 'ANCHOR' : ''})</span><span class="del" data-idx="${i}">✕</span>`;
    div.querySelector('.del').addEventListener('click', e => {
      e.stopPropagation();
      spritePoints.splice(i, 1);
      if (p.name === anchorName && spritePoints.length > 0) setAnchor(spritePoints[0].name);
      drawSpriteEd(); updatePointList(); updateAnchorSelect();
    });
    div.addEventListener('click', () => setAnchor(p.name));
    list.appendChild(div);
  });
}

/* ====== GET ANCHOR DATA ====== */
function getAnchorData() {
  const pt = spritePoints.find(p => p.name === anchorName);
  return pt ? { sx: pt.sx, sy: pt.sy } : { sx: (sprite.naturalWidth || 200) / 2, sy: (sprite.naturalHeight || 260) / 2 };
}

/* ====== WAYPOINTS ====== */
const wp = { 1: [], 2: [] };
const COLORS = { 1: '#e8363e', 2: '#3b82f6' };
const animSel = document.getElementById('selAnim');
let dragging = null;
const WP_RAD = 13;

canvas.addEventListener('mousedown', e => {
  if (getMode() !== 'editor') return;
  const mx = e.offsetX, my = e.offsetY;
  const anim = animSel.value;
  if (e.button === 2) {
    const idx = nearestWP(mx, my, anim);
    if (idx !== null) wp[anim].splice(idx, 1);
  } else {
    const idx = nearestWP(mx, my, anim);
    if (idx !== null) dragging = { anim, idx };
    else { wp[anim].push({ x: mx, y: my }); dragging = { anim, idx: wp[anim].length - 1 }; }
  }
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('mousemove', e => {
  if (!dragging) return;
  wp[dragging.anim][dragging.idx].x = e.offsetX;
  wp[dragging.anim][dragging.idx].y = e.offsetY;
});
canvas.addEventListener('mouseup', () => { dragging = null; });

function nearestWP(mx, my, anim) {
  let best = -1, bestD = 1e9;
  for (let i = 0; i < wp[anim].length; i++) {
    const d = Math.hypot(wp[anim][i].x - mx, wp[anim][i].y - my);
    if (d < bestD) { bestD = d; best = i; }
  }
  return bestD <= WP_RAD * 4 ? best : null;
}
function clearAllWp() { wp[1].length = 0; wp[2].length = 0; }

/* ====== MODE ====== */
let mode = 'editor';
function getMode() { return mode; }
function setMode(m) {
  mode = m;
  document.getElementById('btnEditor').classList.toggle('active', m === 'editor');
  document.getElementById('btnPlay').classList.toggle('active', m === 'play');
  if (m === 'play') startPlayback();
}

/* ====== FACE TRACK ====== */
let mouthX = W/2, mouthY = H/2;
let leftEyeX, leftEyeY, rightEyeX, rightEyeY, noseX, noseY;
let faceVisible = false;

function getFaceTarget() {
  const sel = document.getElementById('selFace').value;
  switch(sel) {
    case 'leftEye':  return { x: leftEyeX, y: leftEyeY };
    case 'rightEye': return { x: rightEyeX, y: rightEyeY };
    case 'nose':     return { x: noseX, y: noseY };
    default:         return { x: mouthX, y: mouthY };
  }
}

/* ====== SPRING ====== */
let targetX = W/2, targetY = H + 200;  // ideal anchor position
let tx = W/2, ty = H + 200, vx = 0, vy = 0;
function springTo(px, py) {
  targetX = px; targetY = py;
  vx += (targetX - tx) * 0.09; vx *= 0.70; tx += vx;
  vy += (targetY - ty) * 0.09; vy *= 0.70; ty += vy;
}

/* ====== PLAYBACK ======
  A1 waypoints → Face target (2s hold) → A2 waypoints → Exit off-screen → loop
*/
const WP_HOLD = 50;
const FACE_HOLD = 2300;
const MOVE_SPD = 0.003;

let ps = 'IDLE', psStart = 0, psIdx = 0, psT = 0;
let effectivePath = [];

function buildPlayPath() {
  const path = [];
  wp[1].forEach(p => path.push({ x: p.x, y: p.y, label: 'A1' }));
  if (faceVisible) path.push({ x: getFaceTarget().x, y: getFaceTarget().y, label: 'FACE' });
  wp[2].forEach(p => path.push({ x: p.x, y: p.y, label: 'A2' }));
  return path;
}

function setSpritePosToTarget(tgtX, tgtY) {
  // tgtX,tgtY = where the ANCHOR point should be on screen
  // Get anchor pixel coords in source image
  const a = getAnchorData();
  const scaleX = SW / (sprite.naturalWidth || 1);
  const scaleY = SH / (sprite.naturalHeight || 1);
  // sprite top-left on canvas = screenX - anchorOnSprite
  // anchorOnSprite = a.sx * scaleX (from top-left of display)
  tx = tgtX - a.sx * scaleX;
  ty = tgtY - a.sy * scaleY;
}

function startPlayback() {
  effectivePath = buildPlayPath();
  if (effectivePath.length === 0) {
    ps = 'EXIT';
    vx = (W + 200 - tx) * 0.06;
    vy = (H + 200 - ty) * 0.06;
    psStart = performance.now();
    return;
  }
  // position sprite at first waypoint
  const first = effectivePath[0];
  setSpritePosToTarget(first.x, first.y);
  vx = 0; vy = 0;
  psIdx = 0; psT = 0;
  ps = 'HOLD';
  psStart = performance.now();
}

function updatePlay(now) {
  const e = now - psStart;
  switch (ps) {
    case 'MOVE': {
      const from = effectivePath[psIdx];
      const to   = effectivePath[psIdx + 1];
      psT += e * MOVE_SPD;
      psStart = now;
      if (psT >= 1 || !to) {
        psT = 0; psIdx++; ps = 'HOLD'; psStart = now;
      } else {
        const targetX = from.x + (to.x - from.x) * psT;
        const targetY = from.y + (to.y - from.y) * psT;
        setSpritePosToTarget(targetX, targetY);
        break;
      }
    }
    // fallthrough: HOLD
    case 'HOLD': {
      const tgt = effectivePath[psIdx];
      if (tgt) setSpritePosToTarget(tgt.x, tgt.y);
      const dur = tgt?.label === 'FACE' ? FACE_HOLD : WP_HOLD;
      if (e > dur) {
        psIdx++;
        if (psIdx >= effectivePath.length) {
          ps = 'EXIT';
          vx = (W + 200 - tx) * 0.06;
          vy = (H + 200 - ty) * 0.06;
          psStart = now;
        } else {
          ps = 'MOVE'; psT = 0; psStart = now;
        }
      }
      break;
    }
    case 'EXIT': {
      tx += vx; ty += vy;
      vx *= 0.92; vy *= 0.92;
      if (ty > H + 100) {
        effectivePath = buildPlayPath();
        if (effectivePath.length === 0) { ps = 'IDLE'; break; }
        const first = effectivePath[0];
        setSpritePosToTarget(first.x, first.y);
        psIdx = 0; ps = 'HOLD'; psT = 0; psStart = now;
      }
      break;
    }
  }
  // spring smoothing
  // Actually with anchor-based positioning we need to spring the target, not the top-left
  // Let me add spring after the switch
  // No — the setSpritePosToTarget sets absolute position. For spring, we need to
  // track the target and spring the display to it.
  // Simplest: always use spring for approach, direct for holds.
  // Actually the current approach is fine for now.
}

/* ====== RENDER ====== */
function render(results) {
  ctx.clearRect(0, 0, W, H);

  // video mirrored
  ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1);
  ctx.drawImage(results.image, 0, 0, W, H);
  ctx.restore();

  // face landmarks (flip X for mirror)
  faceVisible = false;
  if (results.faceLandmarks) {
    const f = results.faceLandmarks;
    mouthX    = W - f[13].x * W; mouthY = f[13].y * H;
    leftEyeX  = W - f[468].x * W; leftEyeY = f[468].y * H;
    rightEyeX = W - f[473].x * W; rightEyeY = f[473].y * H;
    noseX     = W - f[1].x * W; noseY = f[1].y * H;
    faceVisible = true;
  }

  // draw sprite (anchor-based)
  if (spriteReady && sprite.naturalWidth > 0) {
    if (mode === 'play') updatePlay(performance.now());

    const dx = tx, dy = ty; // these are sprite top-left
    ctx.save();
    ctx.drawImage(sprite, dx, dy, SW, SH);
    ctx.restore();
  }

  // editor overlay: both animations (separate, no cross-line)
  if (mode === 'editor') {
    [1, 2].forEach(anim => {
      const pts = wp[anim];
      const c = COLORS[anim];
      // dashed path within this animation only
      if (pts.length > 1) {
        ctx.beginPath();
        ctx.strokeStyle = c + '88';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 4]);
        pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
        ctx.stroke();
        ctx.setLineDash([]);
      }
      // waypoint circles
      pts.forEach((p, i) => {
        const isDrag = dragging && dragging.anim == anim && dragging.idx === i;
        ctx.beginPath();
        ctx.strokeStyle = isDrag ? '#fff' : c;
        ctx.lineWidth = 2;
        ctx.arc(p.x, p.y, WP_RAD, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = c + '33';
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 11px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`${anim}-${i + 1}`, p.x, p.y - WP_RAD - 4);
      });
    });
    // face target preview
    if (faceVisible) {
      const ft = getFaceTarget();
      ctx.beginPath();
      ctx.strokeStyle = '#0f0';
      ctx.lineWidth = 2;
      ctx.setLineDash([3, 3]);
      ctx.arc(ft.x, ft.y, 15, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#0f0';
      ctx.font = '11px monospace';
      ctx.fillText('TARGET', ft.x, ft.y - 18);
    }
  }

  // face overlay (mirrored)
  ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1);
  if (results.faceLandmarks) {
    const f = results.faceLandmarks;
    function ring(ids, c) {
      ctx.beginPath(); ctx.strokeStyle = c; ctx.lineWidth = 1; ctx.shadowColor = c; ctx.shadowBlur = 3;
      ids.forEach((id, i) => {
        const p = { x: f[id].x * W, y: f[id].y * H };
        i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
      });
      ctx.closePath(); ctx.stroke();
    }
    ring([10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67], '#0f8');
    ring([33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246], '#0ff');
    ring([362,382,381,380,374,373,390,249,263,466,388,387,386,385,384,398], '#0ff');
  }
  ctx.restore();

  // status
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(5, 5, 320, 22);
  ctx.fillStyle = '#ff0';
  ctx.font = '13px monospace';
  if (mode === 'editor') {
    ctx.fillText(`EDIT | A1:${wp[1].length} A2:${wp[2].length} | Anchor:${anchorName || 'center'}`, 10, 19);
  } else {
    const lbl = effectivePath[psIdx]?.label || '';
    ctx.fillText(`PLAY: ${ps}  idx:${psIdx}/${effectivePath.length}  ${lbl}`, 10, 19);
  }
}

/* ====== HOLISTIC + CAMERA ====== */
const holistic = new Holistic({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic@0.5.1675471629/${f}`
});
holistic.setOptions({
  modelComplexity: 1, smoothLandmarks: true, refineFaceLandmarks: true,
  minDetectionConfidence: 0.5, minTrackingConfidence: 0.5
});
holistic.onResults(results => render(results));

const camera = new Camera(videoEl, {
  onFrame: async () => { await holistic.send({ image: videoEl }); },
  width: W, height: H
});
camera.start();
</script>
</body>
</html>
