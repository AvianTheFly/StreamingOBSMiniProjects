<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; }
    #status {
      position: fixed; top: 10px; left: 10px;
      color: lime; font-family: monospace; font-size: 13px;
      background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 4px; z-index: 1;
    }
    #panel {
      position: fixed; top: 10px; right: 10px; z-index: 10;
      background: rgba(0,0,0,0.88); color: #ddd; font-family: monospace; font-size: 12px;
      padding: 10px 14px; border-radius: 8px; min-width: 240px;
      max-height: 96vh; overflow-y: auto;
    }
    .section-head {
      font-size: 10px; color: #555; margin: 8px 0 3px;
      padding-top: 6px; border-top: 1px solid #222; letter-spacing: 1px;
    }
    #panel label { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
    #panel select, #panel input[type=range] { flex: 1; }
    #panel button {
      margin-top: 5px; width: 100%; padding: 5px 0; cursor: pointer;
      background: #1a1a1a; color: #ccc; border: 1px solid #383838; border-radius: 4px;
      font-family: monospace; font-size: 12px;
    }
    #panel button:hover { background: #2a2a2a; }
    #panel button.active { background: #0a2a0a; border-color: #0f0; color: #0f0; }
    #panel button.warn { border-color: #633; color: #f88; }
    #panel button.warn:hover { background: #2a1010; }
    .val { width: 40px; text-align: right; font-size: 11px; color: #666; flex-shrink: 0; }

    #slots { display: flex; gap: 3px; margin: 4px 0; }
    .slot-btn {
      flex: 1; padding: 5px 2px; font-size: 11px; text-align: center;
      background: #111; border: 1px solid #2a2a2a; border-radius: 4px;
      cursor: pointer; color: #555; font-family: monospace;
    }
    .slot-btn:hover { background: #1a1a1a; color: #999; }
    .slot-btn.active { border-color: #06f; color: #4af; background: #001020; }
    .slot-btn.loaded { border-color: #393; color: #7b7; }
    .slot-btn.active.loaded { border-color: #0f6; color: #0f6; background: #001a0a; }
    .slot-name { font-size: 8px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    #overlay {
      display: none; position: absolute; border: 2px dashed rgba(255,80,80,0.8);
      cursor: move; user-select: none; touch-action: none; transform-origin: center center;
    }
    #overlay img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    #overlay .handle-resize {
      position: absolute; right: -6px; bottom: -6px; width: 16px; height: 16px;
      cursor: nwse-resize; background: rgba(255,220,0,0.7); border: 2px solid yellow; border-radius: 50%;
    }
    #overlay .handle-rotate {
      position: absolute; right: -6px; top: -6px; width: 16px; height: 16px;
      cursor: grab; background: rgba(0,255,0,0.6); border: 2px solid lime; border-radius: 50%;
    }
    #overlay-hint {
      position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
      color: yellow; font-family: monospace; font-size: 12px;
      background: rgba(0,0,0,0.7); padding: 5px 14px; border-radius: 4px; z-index: 10; display: none;
    }
    #file-input { display: none; }
  </style>
</head>
<body>
<video id="video" autoplay playsinline style="display:none;"></video>
<canvas id="canvas"></canvas>
<div id="status">Loading MediaPipe...</div>

<div id="overlay">
  <img id="overlay-img" src="" draggable="false">
  <div class="handle-resize"></div>
  <div class="handle-rotate"></div>
</div>
<div id="overlay-hint">Drag = move &nbsp;·&nbsp; 🟡 = resize &nbsp;·&nbsp; 🟢 = rotate</div>
<input type="file" id="file-input" accept="image/*">

<div id="panel">

  <div class="section-head">IMAGE SLOTS &nbsp;(keys 1–5)</div>
  <div id="slots">
    <div class="slot-btn active" data-slot="0">1<span class="slot-name" id="sn0">—</span></div>
    <div class="slot-btn"        data-slot="1">2<span class="slot-name" id="sn1">—</span></div>
    <div class="slot-btn"        data-slot="2">3<span class="slot-name" id="sn2">—</span></div>
    <div class="slot-btn"        data-slot="3">4<span class="slot-name" id="sn3">—</span></div>
    <div class="slot-btn"        data-slot="4">5<span class="slot-name" id="sn4">—</span></div>
  </div>
  <button id="loadImgBtn">📂 Load Image into Slot</button>
  <button id="clearSlotBtn" class="warn">✕ Clear This Slot</button>

  <div class="section-head">SOURCE</div>
  <label>Source:
    <select id="source">
      <option value="shoulders">Shoulders</option>
      <option value="face">Face (4-pt avg)</option>
    </select>
  </label>

  <div class="section-head">PLACEMENT</div>
  <label>Off X:    <input type="range" id="offX"    min="-500" max="500"  value="0">  <span class="val" id="offXv">0</span></label>
  <label>Off Y:    <input type="range" id="offY"    min="-300" max="600"  value="0">  <span class="val" id="offYv">0</span></label>
  <label>Width:    <input type="range" id="szW"     min="20"   max="800"  value="200"><span class="val" id="szWv">200</span></label>
  <label>Height:   <input type="range" id="szH"     min="20"   max="800"  value="200"><span class="val" id="szHv">200</span></label>
  <label>Scale:    <input type="range" id="scale3d" min="10"   max="300"  value="100"><span class="val" id="scale3dv">1.00</span></label>
  <label>Rotation: <input type="range" id="rot"     min="-180" max="180"  value="0">  <span class="val" id="rotv">0°</span></label>
  <label>Occlusion: <input type="checkbox" id="occlude"></label>

  <div class="section-head">VIEW TOGGLES</div>
  <button id="btnVideo"   class="active">👁 Video Feed</button>
  <button id="btnFace"    class="active">🧠 Face Mesh</button>
  <button id="btnPose"    class="active">🦴 Pose Skeleton</button>
  <button id="btnDots"    class="active">🎯 Track Dots</button>

  <div class="section-head">ACTIONS</div>
  <button id="saveBtn">💾 Save All Slots</button>
  <button id="toggleEdit">✏️ Drag to Place</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic@0.5.1675471629/holistic.js"></script>
<script>
const video      = document.getElementById('video');
const canvas     = document.getElementById('canvas');
const ctx        = canvas.getContext('2d');
const statusEl   = document.getElementById('status');
const overlay    = document.getElementById('overlay');
const overlayImg = document.getElementById('overlay-img');
const overlayHint= document.getElementById('overlay-hint');
canvas.width = 1280; canvas.height = 720;

// ──────────────────────────────────────────
//  SLOTS
// ──────────────────────────────────────────
const NUM_SLOTS = 5;
let currentSlot = 0;

function defaultCfg() {
  return { source:'shoulders', offX:0, offY:0, w:200, h:200, scaleMult:1.0, rotation:0 };
}
const slots = Array.from({length:NUM_SLOTS}, () => ({
  img:null, src:null, name:'—', cfg: defaultCfg()
}));
const smooth = Array.from({length:NUM_SLOTS}, () => ({
  x:640, y:360, scale:1, rot:0, ready:false, refSpan:0
}));

const cfg  = () => slots[currentSlot].cfg;
const aImg = () => slots[currentSlot].img;

// ──────────────────────────────────────────
//  VISIBILITY
// ──────────────────────────────────────────
let showVideo = true, showFace = true, showPose = true, showDots = true;

function toggle(btnId, getter, setter) {
  document.getElementById(btnId).addEventListener('click', function() {
    setter(!getter());
    this.classList.toggle('active', getter());
  });
}
toggle('btnVideo', ()=>showVideo, v=>{ showVideo=v; });
toggle('btnFace',  ()=>showFace,  v=>{ showFace=v;  });
toggle('btnPose',  ()=>showPose,  v=>{ showPose=v;  });
toggle('btnDots',  ()=>showDots,  v=>{ showDots=v;  });

// ──────────────────────────────────────────
//  SLOT UI
// ──────────────────────────────────────────
function updateSlotUI() {
  document.querySelectorAll('.slot-btn').forEach(b => {
    const i = +b.dataset.slot;
    b.classList.toggle('active', i === currentSlot);
    b.classList.toggle('loaded', !!slots[i].img);
  });
}

function syncPanel() {
  const c = cfg();
  document.getElementById('source').value   = c.source;
  document.getElementById('offX').value     = c.offX;
  document.getElementById('offY').value     = c.offY;
  document.getElementById('szW').value      = c.w;
  document.getElementById('szH').value      = c.h;
  document.getElementById('scale3d').value  = Math.round(c.scaleMult*100);
  document.getElementById('rot').value      = c.rotation;
  overlayImg.src = slots[currentSlot].src || '';
  updateUI();
}

function updateUI() {
  const c = cfg();
  document.getElementById('offXv').textContent    = c.offX;
  document.getElementById('offYv').textContent    = c.offY;
  document.getElementById('szWv').textContent     = c.w;
  document.getElementById('szHv').textContent     = c.h;
  document.getElementById('scale3dv').textContent = c.scaleMult.toFixed(2);
  document.getElementById('rotv').textContent     = c.rotation + '°';
}

function switchSlot(i) {
  currentSlot = i;
  smooth[i].ready = false;
  syncPanel();
  updateSlotUI();
}

document.querySelectorAll('.slot-btn').forEach(b =>
  b.addEventListener('click', () => switchSlot(+b.dataset.slot))
);
window.addEventListener('keydown', e => {
  const n = parseInt(e.key);
  if (n >= 1 && n <= NUM_SLOTS && !e.ctrlKey && !e.metaKey) switchSlot(n-1);
});

// ──────────────────────────────────────────
//  IMAGE LOADING
// ──────────────────────────────────────────
function loadImg(slotIdx, src, name) {
  const img = new Image();
  img.onload = () => {
    slots[slotIdx].img = img;
    slots[slotIdx].src = src;
    slots[slotIdx].name = name;
    document.getElementById('sn'+slotIdx).textContent = name.slice(0,7);
    updateSlotUI();
    if (slotIdx === currentSlot) overlayImg.src = src;
  };
  img.src = src;
}

document.getElementById('loadImgBtn').addEventListener('click', () =>
  document.getElementById('file-input').click()
);
document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => { loadImg(currentSlot, ev.target.result, file.name); autoSave(); };
  reader.readAsDataURL(file);
  e.target.value = '';
});
document.getElementById('clearSlotBtn').addEventListener('click', () => {
  slots[currentSlot] = { img:null, src:null, name:'—', cfg: defaultCfg() };
  document.getElementById('sn'+currentSlot).textContent = '—';
  overlayImg.src = '';
  syncPanel(); updateSlotUI(); autoSave();
});

// ──────────────────────────────────────────
//  AUTO-SAVE (debounced 800ms)
// ──────────────────────────────────────────
let _saveTimer = null;
function autoSave() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => {
    const payload = { slots: slots.map(s => ({ name:s.name, cfg:s.cfg, src:s.src||null })) };
    fetch('/save-config', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    }).catch(()=>{});
  }, 800);
}

// ──────────────────────────────────────────
//  PANEL → CFG WIRING
// ──────────────────────────────────────────
document.getElementById('source').addEventListener('change', e => {
  cfg().source = e.target.value;
  smooth[currentSlot].ready = false; smooth[currentSlot].refSpan = 0;
  autoSave();
});
['offX','offY'].forEach(id =>
  document.getElementById(id).addEventListener('input', e => { cfg()[id] = +e.target.value; updateUI(); autoSave(); })
);
document.getElementById('szW').addEventListener('input',    e => { cfg().w = +e.target.value; updateUI(); autoSave(); });
document.getElementById('szH').addEventListener('input',    e => { cfg().h = +e.target.value; updateUI(); autoSave(); });
document.getElementById('scale3d').addEventListener('input',e => { cfg().scaleMult = +e.target.value/100; updateUI(); autoSave(); });
document.getElementById('rot').addEventListener('input',    e => { cfg().rotation = +e.target.value; updateUI(); autoSave(); });

// ──────────────────────────────────────────
//  SAVE
// ──────────────────────────────────────────
document.getElementById('saveBtn').addEventListener('click', () => {
  // Save cfgs + names + base64 image data so images persist across sessions
  const payload = { slots: slots.map(s => ({ name:s.name, cfg:s.cfg, src:s.src||null })) };
  fetch('/save-config', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  }).then(r=>r.json()).then(() => {
    document.getElementById('saveBtn').textContent = '✅ Saved!';
    setTimeout(()=>{ document.getElementById('saveBtn').textContent = '💾 Save All Slots'; }, 1500);
  }).catch(() => {
    document.getElementById('saveBtn').textContent = '❌ Failed';
    setTimeout(()=>{ document.getElementById('saveBtn').textContent = '💾 Save All Slots'; }, 1500);
  });
});

// ──────────────────────────────────────────
//  LOAD SAVED CONFIG
// ──────────────────────────────────────────
fetch('/load-config').then(r=>r.json()).then(data => {
  if (data.slots) {
    data.slots.forEach((s,i) => {
      if (i >= NUM_SLOTS) return;
      Object.assign(slots[i].cfg, s.cfg||{});
      if (s.name && s.name !== '—') {
        slots[i].name = s.name;
        document.getElementById('sn'+i).textContent = s.name.slice(0,7);
      }
      // Restore saved image if present
      if (s.src) loadImg(i, s.src, s.name || '—');
    });
  } else {
    // legacy single-slot config
    Object.assign(slots[0].cfg, data);
  }
  syncPanel(); updateSlotUI();
  statusEl.textContent = 'Config loaded ✓';
}).catch(()=>{ statusEl.textContent = 'No saved config found'; });

// ──────────────────────────────────────────
//  EDIT MODE / DRAG-TO-PLACE
// ──────────────────────────────────────────
let editMode = false;
document.getElementById('toggleEdit').addEventListener('click', function() {
  editMode = !editMode;
  overlay.style.display   = editMode ? 'block' : 'none';
  overlayHint.style.display = editMode ? 'block' : 'none';
  this.textContent = editMode ? '✅ Done Placing' : '✏️ Drag to Place';
  this.classList.toggle('active', editMode);
});

let dragMode=null, dragOX, dragOY, dragSave={};
overlay.addEventListener('pointerdown', e => {
  e.preventDefault();
  const t = e.target;
  if (t.classList.contains('handle-rotate')) {
    dragMode='rotate'; dragOX=e.clientX; dragOY=e.clientY; dragSave.rot=cfg().rotation;
  } else if (t.classList.contains('handle-resize')) {
    dragMode='resize'; dragOX=e.clientX; dragOY=e.clientY; dragSave.w=cfg().w; dragSave.h=cfg().h;
  } else {
    dragMode='drag'; dragOX=e.clientX; dragOY=e.clientY; dragSave.offX=cfg().offX; dragSave.offY=cfg().offY;
  }
  overlay.setPointerCapture(e.pointerId);
});
overlay.addEventListener('pointermove', e => {
  if (!dragMode) return;
  const c = cfg();
  if (dragMode==='drag') {
    c.offX = dragSave.offX + (e.clientX-dragOX);
    c.offY = dragSave.offY + (e.clientY-dragOY);
  } else if (dragMode==='resize') {
    const dx = e.clientX-dragOX;
    c.w = Math.max(20, Math.round(dragSave.w+dx));
    c.h = Math.max(20, Math.round(dragSave.h+dx));
  } else if (dragMode==='rotate') {
    const rect=overlay.getBoundingClientRect();
    const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
    const a1=Math.atan2(dragOY-cy,dragOX-cx), a2=Math.atan2(e.clientY-cy,e.clientX-cx);
    c.rotation = Math.round(Math.max(-180,Math.min(180, dragSave.rot+(a2-a1)*180/Math.PI)));
  }
  document.getElementById('offX').value = c.offX;
  document.getElementById('offY').value = c.offY;
  document.getElementById('szW').value  = c.w;
  document.getElementById('szH').value  = c.h;
  document.getElementById('rot').value  = c.rotation;
  updateUI();
});
overlay.addEventListener('pointerup', () => { dragMode=null; autoSave(); });

// ──────────────────────────────────────────
//  MEDIAPIPE POSE SKELETON DEFS
// ──────────────────────────────────────────
const CONNECTIONS = [
  // face outline
  [0,1],[1,2],[2,3],[3,7],[0,4],[4,5],[5,6],[6,8],
  // shoulders
  [11,12],
  // left arm
  [11,13],[13,15],[15,17],[15,19],[15,21],[17,19],
  // right arm
  [12,14],[14,16],[16,18],[16,20],[16,22],[18,20],
  // torso
  [11,23],[12,24],[23,24],
  // left leg
  [23,25],[25,27],[27,29],[29,31],[27,31],
  // right leg
  [24,26],[26,28],[28,30],[30,32],[28,32]
];

// Assign colors by body region
function poseColor(id) {
  if (id <= 10)                           return '#ffdd00'; // face
  if (id >= 11 && id <= 22)              return '#00ccff'; // arms/shoulders
  if (id === 23 || id === 24)            return '#ff8800'; // hips
  if (id >= 25 && id <= 32)             return '#ff44aa'; // legs
  return '#fff';
}

// Named landmarks for labels
const POSE_LABELS = {
  11:'L.SH', 12:'R.SH', 13:'L.EL', 14:'R.EL',
  15:'L.WR', 16:'R.WR', 23:'L.HIP', 24:'R.HIP',
  25:'L.KN', 26:'R.KN', 27:'L.AN', 28:'R.AN'
};

// ──────────────────────────────────────────
//  HOLISTIC
// ──────────────────────────────────────────
let _pose = null;
const holistic = new Holistic({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic@0.5.1675471629/${f}`
});
holistic.setOptions({
  modelComplexity:1, smoothLandmarks:true, refineFaceLandmarks:true,
  minDetectionConfidence:0.5, minTrackingConfidence:0.5
});
holistic.onResults(onResults);

// ──────────────────────────────────────────
//  RENDER
// ──────────────────────────────────────────
function onResults(results) {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // 1) VIDEO
  if (showVideo) {
    ctx.save();
    ctx.translate(canvas.width,0); ctx.scale(-1,1);
    ctx.drawImage(results.image,0,0,canvas.width,canvas.height);
    ctx.restore();
  }

  if (!results.faceLandmarks?.length) { statusEl.textContent='No face detected'; return; }

  const fLM = results.faceLandmarks;
  _pose = results.poseLandmarks || _pose;

  // coord helpers (mirrored canvas px)
  const fTC = id => ({ x:(1-fLM[id].x)*canvas.width,  y:fLM[id].y*canvas.height });
  const pTC = id => _pose ? ({ x:(1-_pose[id].x)*canvas.width, y:_pose[id].y*canvas.height }) : null;
  const vis = id => _pose ? (_pose[id].visibility ?? 1) : 0;

  // ── 2) TRACKING ──
  const c = cfg(), sm = smooth[currentSlot];
  let rawX=0, rawY=0, rawScale=1, rawRot=c.rotation, span=0;

  if (c.source==='shoulders' && _pose) {
    const L=pTC(11), R=pTC(12);
    const cx=(L.x+R.x)/2, cy=(L.y+R.y)/2;
    const sw=Math.hypot(L.x-R.x, L.y-R.y);
    const ang=Math.atan2(L.y-R.y, L.x-R.x)*180/Math.PI;
    if (!sm.refSpan) sm.refSpan=sw;
    rawX=cx+c.offX; rawY=cy+c.offY;
    rawScale=sw/120; rawRot=ang+c.rotation; span=sw;
  } else {
    const pts=[10,152,139,368].map(fTC);
    rawX=pts.reduce((s,p)=>s+p.x,0)/4+c.offX;
    rawY=pts.reduce((s,p)=>s+p.y,0)/4+c.offY;
    const fs=Math.hypot(
      Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),
      Math.hypot(pts[2].x-pts[3].x,pts[2].y-pts[3].y));
    if (!sm.refSpan) sm.refSpan=fs;
    rawScale=fs/sm.refSpan; rawRot=c.rotation; span=fs;
  }

  const lr=0.15;
  if (!sm.ready) { sm.x=rawX; sm.y=rawY; sm.scale=rawScale; sm.rot=rawRot; sm.ready=true; }
  sm.x     += (rawX-sm.x)*lr;
  sm.y     += (rawY-sm.y)*lr;
  sm.scale += (rawScale-sm.scale)*lr;
  let rd=rawRot-sm.rot; while(rd>180)rd-=360; while(rd<-180)rd+=360;
  sm.rot += rd*lr;

  const px=sm.x, py=sm.y;
  const fsx=sm.scale*c.scaleMult*(c.w/120);
  const fsy=sm.scale*c.scaleMult*(c.h/120);

  // ── 3) IMAGE (behind body) ──
  const img=aImg();
  if (img?.complete && img.naturalWidth>0) {
    ctx.save();
    ctx.translate(px,py);
    ctx.rotate(sm.rot*Math.PI/180);
    ctx.scale(fsx,fsy);
    ctx.drawImage(img,-60,-60,120,120);
    ctx.restore();
  }

  // ── 4) POSE SKELETON ──
  if (showPose && _pose) {
    ctx.save();

    // Connections
    for (const [a,b] of CONNECTIONS) {
      const pa=pTC(a), pb=pTC(b);
      if (!pa||!pb) continue;
      if (vis(a)<0.25||vis(b)<0.25) continue;
      const col=poseColor(a);
      ctx.strokeStyle=col+'cc'; ctx.lineWidth=3;
      ctx.shadowColor=col; ctx.shadowBlur=8;
      ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y); ctx.stroke();
    }

    // Landmark dots
    for (let i=0;i<33;i++) {
      const pt=pTC(i); if(!pt||vis(i)<0.25) continue;
      const col=poseColor(i);
      const r = (i===11||i===12||i===23||i===24) ? 8 : 5;
      ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=12;
      ctx.beginPath(); ctx.arc(pt.x,pt.y,r,0,Math.PI*2); ctx.fill();
    }

    // Labels
    ctx.shadowBlur=0; ctx.font='bold 11px monospace'; ctx.fillStyle='#eee';
    for (const [id,label] of Object.entries(POSE_LABELS)) {
      const pt=pTC(+id);
      if (pt&&vis(+id)>0.4) {
        ctx.fillStyle='rgba(0,0,0,0.5)';
        ctx.fillRect(pt.x+9, pt.y-13, label.length*7+4, 14);
        ctx.fillStyle=poseColor(+id);
        ctx.fillText(label, pt.x+11, pt.y-2);
      }
    }

    ctx.restore();
  }

  // ── 5) FACE MESH ──
  if (showFace) {
    ctx.save();
    ctx.translate(canvas.width,0); ctx.scale(-1,1);
    const p=id=>({x:fLM[id].x*canvas.width, y:fLM[id].y*canvas.height});

    const ring=(ids,color,lw=2)=>{
      ctx.beginPath(); ctx.strokeStyle=color; ctx.lineWidth=lw;
      ctx.shadowColor=color; ctx.shadowBlur=6;
      ids.forEach((id,i)=>{ const{x,y}=p(id); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
      ctx.closePath(); ctx.stroke();
    };
    const fdot=(id,color,r=3)=>{
      const{x,y}=p(id); ctx.beginPath(); ctx.fillStyle=color;
      ctx.shadowBlur=0; ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    };

    ring([33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246],'#00ccff');
    ring([362,382,381,380,374,373,390,249,263,466,388,387,386,385,384,398],'#00ccff');
    ring([6,197,195,5,4,129,98,97,2,326,327],'#ffcc00');
    ring([61,146,91,181,84,17,314,405,321,375,291,409,270,269,267,0,37,39,40,185,61],'#ff4444',2);
    ring([78,95,88,178,87,14,317,402,318,324,308,415,310,311,312,407,273,269,267,0,37,39,40,78],'#ff8888',1.5);
    ring([10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67],'#00ff00',3);
    fdot(468,'#ff00ff',4); fdot(473,'#ff00ff',4);
    fdot(13,'#ff4444',4); fdot(0,'#ff4444',4);
    ctx.restore();
  }

  // ── 6) TRACKING DOTS ──
  if (showDots && _pose && c.source==='shoulders') {
    const L=pTC(11), R=pTC(12);
    const cx=(L.x+R.x)/2, cy=(L.y+R.y)/2;
    ctx.save(); ctx.shadowBlur=0;
    // dashed shoulder line
    ctx.strokeStyle='rgba(0,255,255,0.8)'; ctx.lineWidth=2; ctx.setLineDash([6,4]);
    ctx.beginPath(); ctx.moveTo(L.x,L.y); ctx.lineTo(R.x,R.y); ctx.stroke();
    ctx.setLineDash([]);
    // anchor dot
    ctx.fillStyle='yellow';
    ctx.beginPath(); ctx.arc(cx+c.offX, cy+c.offY, 7, 0, Math.PI*2); ctx.fill();
    // smooth lag line
    ctx.strokeStyle='rgba(255,255,0,0.35)'; ctx.lineWidth=1; ctx.setLineDash([2,4]);
    ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(rawX,rawY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  // ── 7) STATUS ──
  statusEl.textContent=`Slot ${currentSlot+1} · ${c.source} · span=${span.toFixed(0)} · ${img?slots[currentSlot].name:'no image'}`;

  // ── 8) OVERLAY SYNC ──
  if (editMode) {
    const ex=canvas.offsetLeft+px-(c.w/2)*sm.scale*c.scaleMult;
    const ey=canvas.offsetTop +py-(c.h/2)*sm.scale*c.scaleMult;
    overlay.style.left      = ex+'px';
    overlay.style.top       = ey+'px';
    overlay.style.width     = Math.round(c.w*sm.scale*c.scaleMult)+'px';
    overlay.style.height    = Math.round(c.h*sm.scale*c.scaleMult)+'px';
    overlay.style.transform = `rotate(${sm.rot}deg)`;
  }
}

// ──────────────────────────────────────────
//  CAMERA
// ──────────────────────────────────────────
let _processing=false;
const camera=new Camera(video,{
  onFrame: async ()=>{
    if(_processing)return; _processing=true;
    await holistic.send({image:video});
    _processing=false;
  },
  width:1280, height:720
});
camera.start()
  .then(()=>{ statusEl.textContent='Camera started'; })
  .catch(err=>{ statusEl.textContent='Camera error: '+err.message; });

updateSlotUI();
syncPanel();
</script>
