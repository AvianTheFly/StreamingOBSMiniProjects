<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Trim Picker Demo</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    body {
      min-height: 100vh;
      overflow: auto;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .demo-shell {
      width: min(640px, 100%);
      display: grid;
      gap: 1rem;
    }

    .demo-shell h1 {
      margin: 0;
      font-size: 1.3rem;
    }

    .demo-shell p,
    .demo-result {
      color: var(--text-mid);
      font-size: 0.88rem;
    }

    .demo-result {
      min-height: 3rem;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface2);
    }
  </style>
</head>
<body>
  <main class="demo-shell">
    <h1>Media trim picker</h1>
    <p>Choose an audio or video file under 30 seconds, drag the trim handles, then save.</p>
    <media-trim-button label="Choose media clip"></media-trim-button>
    <div class="demo-result" id="demo-result">No clip saved yet.</div>
  </main>

  <script type="module">
    import './assets/js/modules/media-trim-picker.js';

    const result = document.querySelector('#demo-result');
    document.addEventListener('media-trim-save', (event) => {
      const { fileName, duration, mimeType, objectUrl } = event.detail;
      result.innerHTML = `
        Saved <strong>${fileName}</strong><br>
        ${duration.toFixed(2)} seconds · ${mimeType}<br>
        <a href="${objectUrl}" target="_blank" rel="noopener">Open saved clip</a>
      `;
    });
  </script>
</body>
</html>
