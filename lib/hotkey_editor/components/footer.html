<footer class="app-footer">
    <div class="assign-status" id="assign-status">
      <div class="a-dot"></div>
      <span class="a-text" id="assign-text">Click the keyboard button on a file to start assigning</span>
    </div>
    <div class="f-sep"></div>
    <span class="save-status" id="save-status"></span>
    <div class="vol-wrap">
      <span class="vol-icon" id="vol-icon" title="Toggle mute">🔊</span>
      <input type="range" id="vol-slider" min="0" max="100" value="80" title="Volume" />
      <span class="vol-label" id="vol-label">80%</span>
    </div>
    <div class="f-sep"></div>
    <div class="f-hints">
      <span><kbd>Click</kbd> preview</span>
      <span><kbd>⌨</kbd> assign</span>
      <span><kbd>Esc</kbd> cancel</span>
      <span><kbd>Ctrl+Z</kbd> undo</span>
      <span><kbd>Ctrl+S</kbd> save</span>
    </div>
  </footer>
