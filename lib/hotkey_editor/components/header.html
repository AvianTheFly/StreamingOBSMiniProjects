<header class="app-header">
    <div class="project-sel-wrap" id="project-sel-wrap">
      <span class="project-sel-label">Media Profile</span>
      <select class="project-sel" id="project-sel" title="Switch active project"></select>
    </div>
    <div class="h-sep"></div>
    <div class="h-stats">
      <span><b id="stat-count">—</b> files</span>
      <span><b id="stat-assigned">—</b> assigned</span>
    </div>
    <span id="stat-dir" title="">—</span>
    <div class="h-actions">
      <span id="page-title" class="h-page-title">Hotkey Editor</span>
      <div class="h-sep"></div>
      <button class="btn-undo" id="undo-btn" type="button" disabled title="Ctrl+Z">↩ Undo</button>
      <button class="btn-save" id="save-btn" type="button" title="Ctrl+S">Save</button>
    </div>
  </header>
